name: webhook-workbench

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webhook_workbench}
      MYSQL_USER: ${MYSQL_USER:-workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workbench}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-workbench-root}
      TZ: UTC
    # Published for a server running on the host. In-compose traffic uses the service name.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    image: ${APP_IMAGE:-webhook-workbench:local}
    build:
      context: .
      target: ${APP_DOCKER_TARGET:-jvm-runtime}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-webhook_workbench}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-workbench}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-workbench}
      WORKBENCH_ACCESS_TOKEN: ${WORKBENCH_ACCESS_TOKEN:-}
      WORKBENCH_RETENTION_MAX_EVENTS_PER_INBOX: ${WORKBENCH_RETENTION_MAX_EVENTS_PER_INBOX:-500}
      WORKBENCH_MAX_BODY_SIZE: ${WORKBENCH_MAX_BODY_SIZE:-8MB}
      WORKBENCH_MAX_PAGE_SIZE: ${WORKBENCH_MAX_PAGE_SIZE:-500}
      WORKBENCH_STREAM_HEARTBEAT_INTERVAL: ${WORKBENCH_STREAM_HEARTBEAT_INTERVAL:-15s}
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
